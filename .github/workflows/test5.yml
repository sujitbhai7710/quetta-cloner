name: Test5
on: workflow_dispatch
env:
  KS_PASS: android
  KS_ALIAS: clonekey
  KEY_PASS: android
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Signing keystore (reuse CLONE_KEYSTORE_B64 secret if set, else generate)
        env:
          CLONE_KEYSTORE_B64: ${{ secrets.CLONE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          if [ -n "$CLONE_KEYSTORE_B64" ]; then
            printf '%s' "$CLONE_KEYSTORE_B64" | base64 -d > keystore/clone.keystore
            echo "Using keystore from CLONE_KEYSTORE_B64 secret"
          else
            keytool -genkeypair -v \
              -keystore keystore/clone.keystore -storetype PKCS12 \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=APK Clone, OU=Clone, O=Clone, C=US" > /dev/null
          fi
      - name: Share keystore with build jobs
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore/clone.keystore
          retention-days: 1
      - name: Share source APK with build jobs
        uses: actions/upload-artifact@v4
        with:
          name: source-apk
          path: Quetta.apk
          retention-days: 1
          compression-level: 0
