name: Build APK clones

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional comma-separated subset of names from names.txt (empty = all)"
        required: false
        default: ""
      make_release:
        description: "Also attach every .apk as a separate, raw (non-zip) asset to a GitHub Release"
        type: boolean
        default: true
  workflow_call:
    inputs:
      only:
        description: "Optional comma-separated subset of names from names.txt (empty = all)"
        type: string
        default: ""
      make_release:
        description: "Also attach every .apk as a separate, raw (non-zip) asset to a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  APK_SOURCE_TAG: apk-source
  KS_PASS: android
  KS_ALIAS: clonekey
  KEY_PASS: android

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.names.outputs.names }}
      source_name: ${{ steps.dl.outputs.src }}
    steps:
      - uses: actions/checkout@v4

      - name: Build clone-name matrix from names.txt
        id: names
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          if [ -n "$ONLY" ]; then
            names=$(printf '%s' "$ONLY" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$')
          else
            names=$(grep -v '^[[:space:]]*$' names.txt)
          fi
          json=$(printf '%s\n' "$names" | jq -R . | jq -s -c .)
          echo "names=$json" >> "$GITHUB_OUTPUT"
          echo "Clone matrix: $json"

      - name: Download source APK
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$APK_SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
             --pattern "Quetta.apk" --pattern "*.apk" --pattern "*.apks" \
             --pattern "*.xapk" --clobber
          # prefer complete bundles (.xapk/.apks) over a bare base .apk
          SRC=""
          for pat in "*.xapk" "*.apks" "Quetta.apk" "*.apk"; do
            for f in $pat; do
              if [ -f "$f" ]; then SRC="$f"; break 2; fi
            done
          done
          if [ -z "$SRC" ]; then
            echo "No source APK/APKS found on release $APK_SOURCE_TAG"
            exit 1
          fi
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "Source: $SRC ($(du -h "$SRC" | cut -f1))"

      - name: Signing keystore (reuse CLONE_KEYSTORE_B64 secret if set, else generate)
        env:
          CLONE_KEYSTORE_B64: ${{ secrets.CLONE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          if [ -n "$CLONE_KEYSTORE_B64" ]; then
            printf '%s' "$CLONE_KEYSTORE_B64" | base64 -d > keystore/clone.keystore
            echo "Using keystore from CLONE_KEYSTORE_B64 secret"
          else
            keytool -genkeypair -v \
              -keystore keystore/clone.keystore -storetype PKCS12 \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=APK Clone, OU=Clone, O=Clone, C=US" > /dev/null
            echo "NOTE: generated a fresh keystore for this run only."
            echo "      Add a CLONE_KEYSTORE_B64 repo secret to reuse the same key across runs."
          fi

      - name: Share keystore with build jobs
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore/clone.keystore
          retention-days: 1

      - name: Share source APK with build jobs
        uses: actions/upload-artifact@v4
        with:
          name: source-apk
          path: ${{ steps.dl.outputs.src }}
          retention-days: 1
          compression-level: 0

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        name: ${{ fromJSON(needs.prepare.outputs.names) }}
    name: clone ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure apksigner is available
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if ! ls "$SDK"/build-tools/*/apksigner >/dev/null 2>&1; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null
          fi

      - name: Get source APK
        uses: actions/download-artifact@v4
        with:
          name: source-apk
          path: .

      - name: Get signing keystore
        uses: actions/download-artifact@v4
        with:
          name: keystore
          path: keystore

      - name: Build clone
        run: |
          set -euo pipefail
          python clone_apk.py --apk "${{ needs.prepare.outputs.source_name }}" \
            --only "${{ matrix.name }}" --out dist --jobs 1 \
            --keystore keystore/clone.keystore \
            --ks-pass "$KS_PASS" --ks-alias "$KS_ALIAS" --key-pass "$KEY_PASS"

      - name: Verify clone
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          AAPT2=$(ls "$SDK"/build-tools/*/aapt2 | sort -V | tail -1)
          F=$(ls "dist/${{ matrix.name }}".apk "dist/${{ matrix.name }}".apks 2>/dev/null | head -1)
          test -n "$F" || { echo "no output produced"; exit 1; }
          if [[ "$F" == *.apks ]]; then
            mkdir -p vt && (cd vt && unzip -qo "../$F" && for a in *.apk; do echo "verify $a"; "$APKSIGNER" verify "$a"; done)
          else
            "$APKSIGNER" verify "$F"
            "$AAPT2" dump badging "$F" | grep -E '^package:|application-label'
          fi

      - name: Upload ${{ matrix.name }} result as its own artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: "dist/${{ matrix.name }}.*"
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Collect all clone APKs (one artifact per clone)
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: dist

      - name: Create release with one result per clone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          shopt -s nullglob
          files=(dist/*.apk dist/*.apks)
          test "${#files[@]}" -gt 0
          (cd dist && find . -maxdepth 1 \( -name '*.apk' -o -name '*.apks' \) -printf '%f\n' | xargs sha256sum > SHA256SUMS.txt)
          TAG="clones-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "APK clones (run ${{ github.run_number }})" \
            --notes "One installable clone per name in names.txt.
          .apk = standalone clone; .apks = clone bundle (base + splits) - install with the free 'SAI' app.
          Verify downloads against SHA256SUMS.txt before installing."
          gh release upload "$TAG" "${files[@]}" dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
