name: Build APK clones

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional comma-separated subset of names from names.txt (empty = all)"
        required: false
        default: ""
      make_release:
        description: "Also attach every .apk as a separate, raw (non-zip) asset to a GitHub Release"
        type: boolean
        default: true
  workflow_call:
    inputs:
      only:
        description: "Optional comma-separated subset of names from names.txt (empty = all)"
        type: string
        default: ""
      make_release:
        description: "Also attach every .apk as a separate, raw (non-zip) asset to a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  APK_SOURCE_TAG: apk-source
  KS_PASS: android
  KS_ALIAS: clonekey
  KEY_PASS: android

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.names.outputs.names }}
      source_name: ${{ steps.dl.outputs.src }}
    steps:
      - uses: actions/checkout@v4

      - name: Build clone-name matrix from names.txt
        id: names
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          if [ -n "$ONLY" ]; then
            names=$(printf '%s' "$ONLY" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$')
          else
            names=$(grep -v '^[[:space:]]*$' names.txt)
          fi
          json=$(printf '%s\n' "$names" | jq -R . | jq -s -c .)
          echo "names=$json" >> "$GITHUB_OUTPUT"
          echo "Clone matrix: $json"

      - name: Download source APK
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$APK_SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
             --pattern "Quetta.apk" --pattern "*.apk" --pattern "*.apks" \
             --pattern "*.xapk" --clobber
          # prefer complete bundles (.xapk/.apks) over a bare base .apk
          SRC=""
          for pat in "*.xapk" "*.apks" "Quetta.apk" "*.apk"; do
            for f in $pat; do
              if [ -f "$f" ]; then SRC="$f"; break 2; fi
            done
          done
          if [ -z "$SRC" ]; then
            echo "No source APK/APKS found on release $APK_SOURCE_TAG"
            exit 1
          fi
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "Source: $SRC ($(du -h "$SRC" | cut -f1))"

      - name: Generate per-clone keystores (persisted in repo)
        env:
          NAMES_JSON: ${{ steps.names.outputs.names }}
        run: |
          set -euo pipefail
          mkdir -p keystores
          # For each clone name, check if a keystore exists. If not, generate one.
          # Keystores are committed to the repo so they persist across runs ->
          # updates install cleanly over previous versions of the same clone.
          echo "$NAMES_JSON" | jq -r '.[]' | while read -r name; do
            safe_name=$(echo "$name" | tr -cd 'A-Za-z0-9._-')
            ks_path="keystores/${safe_name}.keystore"
            if [ -f "$ks_path" ]; then
              echo "  ✓ $name: reusing existing keystore ($ks_path)"
            else
              echo "  + $name: generating NEW keystore ($ks_path)"
              keytool -genkeypair -v \
                -keystore "$ks_path" -storetype PKCS12 \
                -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$KS_PASS" -keypass "$KEY_PASS" \
                -dname "CN=APK Clone $safe_name, OU=Clone, O=Clone, C=US" > /dev/null 2>&1 || true
            fi
          done
          echo ""
          echo "Keystore inventory:"
          ls -1 keystores/ 2>/dev/null | sed 's/^/  /' || echo "  (none)"

      - name: Commit any newly-generated keystores back to repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage any new keystores
          git add keystores/*.keystore 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new keystores to commit."
          else
            echo "Committing new keystores..."
            git commit -m "chore: add per-clone keystores for new names" -m "Auto-generated by GitHub Actions. Each clone has its own unique signing key, persisted in the repo so updates install cleanly over previous versions of the same clone."
            git push
            echo "Pushed."
          fi

      - name: Share all keystores with build jobs
        uses: actions/upload-artifact@v4
        with:
          name: keystores
          path: keystores/
          retention-days: 1

      - name: Share source APK with build jobs
        uses: actions/upload-artifact@v4
        with:
          name: source-apk
          path: ${{ steps.dl.outputs.src }}
          retention-days: 1
          compression-level: 0

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        name: ${{ fromJSON(needs.prepare.outputs.names) }}
    name: clone ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure apksigner is available
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if ! ls "$SDK"/build-tools/*/apksigner >/dev/null 2>&1; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null
          fi

      - name: Install APKEditor (ARSCLib-based, same as BFE)
        run: |
          set -euo pipefail
          wget -q https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar -O /usr/local/bin/APKEditor.jar
          echo "APKEDITOR_JAR=/usr/local/bin/APKEditor.jar" >> "$GITHUB_ENV"

      - name: Get source APK
        uses: actions/download-artifact@v4
        with:
          name: source-apk
          path: .

      - name: Get signing keystores
        uses: actions/download-artifact@v4
        with:
          name: keystores
          path: keystores

      - name: Build clone
        run: |
          set -euo pipefail
          # Use the per-clone keystore (each clone has its own unique key,
          # persisted in the repo so updates install over previous versions).
          safe_name=$(echo "${{ matrix.name }}" | tr -cd 'A-Za-z0-9._-')
          KS_PATH="keystores/${safe_name}.keystore"
          if [ ! -f "$KS_PATH" ]; then
            echo "ERROR: keystore not found for ${{ matrix.name }} at $KS_PATH"
            echo "Available keystores:"
            ls -la keystores/ 2>/dev/null || true
            exit 1
          fi
          echo "Using keystore: $KS_PATH"
          python clone_apk.py --apk "${{ needs.prepare.outputs.source_name }}" \
            --only "${{ matrix.name }}" --out dist --jobs 1 \
            --keystore "$KS_PATH" \
            --ks-pass "$KS_PASS" --ks-alias "$KS_ALIAS" --key-pass "$KEY_PASS"

      - name: Verify clone
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          AAPT2=$(ls "$SDK"/build-tools/*/aapt2 | sort -V | tail -1)
          F=""
          for c in "dist/${{ matrix.name }}.apk" "dist/${{ matrix.name }}.apks"; do
            if [ -f "$c" ]; then F="$c"; break; fi
          done
          if [ -z "$F" ]; then
            echo "no output produced"; exit 1
          fi
          echo "verifying $F"
          if [ "${F##*.}" = "apks" ]; then
            mkdir -p vt
            (cd vt && unzip -qo "../$F" && for a in *.apk; do echo "verify $a"; "$APKSIGNER" verify --min-sdk-version 21 "$a"; done)
          else
            "$APKSIGNER" verify --min-sdk-version 21 "$F"
            "$AAPT2" dump badging "$F" | grep -E '^package:|application-label'
          fi

      - name: Upload ${{ matrix.name }} result as its own artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: "dist/${{ matrix.name }}.*"
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Collect all clone APKs (one artifact per clone)
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: dist

      - name: Create release with one result per clone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          shopt -s nullglob
          files=(dist/*.apk dist/*.apks)
          test "${#files[@]}" -gt 0
          (cd dist && find . -maxdepth 1 \( -name '*.apk' -o -name '*.apks' \) -printf '%f\n' | xargs sha256sum > SHA256SUMS.txt)
          TAG="clones-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "APK clones (run ${{ github.run_number }})" \
            --notes "One installable clone per name in names.txt.
          Each clone is a single standalone .apk — install directly, no SAI needed.
          Built with APKEditor (ARSCLib) — same library BFE uses.
          Verify downloads against SHA256SUMS.txt before installing."
          gh release upload "$TAG" "${files[@]}" dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
