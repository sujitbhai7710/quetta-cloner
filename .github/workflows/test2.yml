name: Test2

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional comma-separated subset of names from names.txt (empty = all)"
        required: false
        default: ""
      make_release:
        description: "Also attach every .apk as a separate, raw (non-zip) asset to a GitHub Release"
        type: boolean
        default: true
  workflow_call:
    inputs:
      only:
        description: "Optional comma-separated subset of names from names.txt (empty = all)"
        type: string
        default: ""
      make_release:
        description: "Also attach every .apk as a separate, raw (non-zip) asset to a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  APK_SOURCE_TAG: apk-source
  APK_SOURCE_NAME: Quetta.apk
  KS_PASS: android
  KS_ALIAS: clonekey
  KEY_PASS: android

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.names.outputs.names }}
    steps:
      - uses: actions/checkout@v4

      - name: Build clone-name matrix from names.txt
        id: names
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          if [ -n "$ONLY" ]; then
            names=$(printf '%s' "$ONLY" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$')
          else
            names=$(grep -v '^[[:space:]]*$' names.txt)
          fi
          json=$(printf '%s\n' "$names" | jq -R . | jq -s -c .)
          echo "names=$json" >> "$GITHUB_OUTPUT"
          echo "Clone matrix: $json"

      - name: Echo matrix
        run: echo "matrix is ${{ steps.names.outputs.names }}"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        name: ${{ fromJSON(needs.prepare.outputs.names) }}
    name: clone ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Show name
        run: echo "building clone ${{ matrix.name }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure apksigner is available
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if ! ls "$SDK"/build-tools/*/apksigner >/dev/null 2>&1; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null
          fi

      - name: Upload ${{ matrix.name }}.apk as its own artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: dist/${{ matrix.name }}.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Collect all clone APKs (one artifact per clone)
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: dist

      - name: Create release with one raw .apk asset per clone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          test "$(ls dist/*.apk | wc -l)" -gt 0
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cd ..
          TAG="clones-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "APK clones (run ${{ github.run_number }})" \
            --notes "One installable clone per name in names.txt.
          Each .apk is a separate raw asset - click any file below to download it directly (no zip wrapping).
          Package id: net.quetta.browser.<name> (lower-cased), app label: <name>.
          Verify your download against SHA256SUMS.txt before installing."
          gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
